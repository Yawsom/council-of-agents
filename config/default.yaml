# Council of Agents — default run configuration
name: my_run
prompt_file: prompts/example.txt
version: A        # A = honest protocol, B = manipulation protocol
mock: false

# At least 2 agents recommended; mix different base models for meaningful divergence.
# NOTE: Keep agents in a similar capability band. Mixing GPT-4 class with 7B models
# degrades debate quality per published benchmarks.
agents:
  - id: agent_gemma
    model: google/gemma-4-26b-a4b-it:free
    temperature: 0.7
    timeout: 120.0
  - id: agent_gpt_oss
    model: openai/gpt-oss-120b:free
    temperature: 0.7
    timeout: 120.0
  - id: agent_llama
    model: meta-llama/llama-3.3-70b-instruct:free
    temperature: 0.7
    timeout: 120.0
  - id: agent_elephant
    model: openrouter/elephant-alpha
    temperature: 0.7
    timeout: 120.0
  - id: agent_qwen
    model: qwen/qwen3-next-80b-a3b-instruct:free
    temperature: 0.7
    timeout: 120.0
  - id: agent_glm
    model: z-ai/glm-4.5-air:free
    temperature: 0.7
    timeout: 120.0

# Gemma serves as arbiter (provocateur) and observer (auditor).
# Note: Gemma will also audit its own agent outputs — factor this into result interpretation.
arbiter_model: google/gemma-4-26b-a4b-it:free
arbiter_temperature: 0.2

observer_model: google/gemma-4-26b-a4b-it:free
observer_temperature: 0.2
observer_frequency: 1    # run observer every N rounds (0 = never)

termination:
  min_new_claims_per_round: 1
  no_challenge_rounds: 2
  min_position_update_rate: 0.1
  max_rounds: 10

identity:
  similarity_high: 0.9
  similarity_low: 0.7
  disambiguation_model: google/gemma-4-26b-a4b-it:free

embedder:
  provider: local               # local (free, no API key) | openai | openrouter | none
  model: all-MiniLM-L6-v2      # downloaded once on first run (~22MB)

# Rate limit hardening — free-tier models have unpublished, dynamic limits
rate_limits:
  stagger_delay: 2.0        # seconds between launching parallel agent calls
  max_backoff: 120.0        # ceiling for retry backoff (free models can need 60-120s waits)
  per_model_concurrency: 1  # max simultaneous requests per unique model ID

# Version B only — manipulation/sycophancy experiment settings
manipulation:
  injection_n: 3
  inject_every_n_rounds: 1
  disguise_model: google/gemma-4-26b-a4b-it:free

artifacts_dir: runs

# API keys — prefer setting via environment variables:
#   OPENROUTER_API_KEY
#   OPENAI_API_KEY (for embeddings when embedder.provider=openai)
# openrouter_api_key: null
# openai_api_key: null
