[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "council"
version = "0.1.0"
description = "A perspective-exploration and stress-test engine using heterogeneous LLMs"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "openai>=1.40",              # used only for embeddings when provider=openai
    "sentence-transformers>=3.0", # local embeddings, no API key required
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "jsonlines>=4.0",
]

[project.scripts]
council = "council.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/council"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default]
features = ["dev"]
